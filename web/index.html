// ---- Command palette (Ctrl+K) ----
// Own things come from /api/index (fetched when the palette opens) and are matched here, instantly.
// Everything else the empire knows comes from the game's own search (/api/search), asked after a short pause
// in typing. Matching looks at the name, the kind (role, planet type) and the system.
// Groups: every kind and every system is also an entry ("Exploration Ship · 6"). Tab or Enter on a group
// scopes the palette to it (lists all its items, typing filters inside); Backspace on an empty search leaves it.
const palette = { open: false, index: [], remote: [], commands: [], rows: [], sel: 0, timer: null, seq: 0, scope: null };


function fuzzy(text, q) {
  // Score a subsequence match: contiguous runs and word starts score higher. Returns null when no match.
  const t = (text || '').toLowerCase();
  let ti = 0, score = 0, run = 0;
  const hits = [];
  for (const ch of q) {
    const at = t.indexOf(ch, ti);
    if (at < 0) return null;
    run = at === ti ? run + 1 : 1;
    score += run * 2 + (at === 0 || t[at - 1] === ' ' ? 5 : 0) - Math.min(at - ti, 5) * 0.2;
    hits.push(at);
    ti = at + 1;
  }
  if (t.startsWith(q)) score += 10;
  return { score, hits };
}

function highlight(text, hits) {
  const set = new Set(hits || []);
  return [...(text || '')].map((c, i) => set.has(i) ? `<b>${esc(c)}</b>` : esc(c)).join('');
}

/** Everything known so far, own first, without duplicates. */
function paletteItems() {
  const seen = new Set(), all = [];
  for (const item of [...palette.index, ...palette.remote]) {
    const k = item.type + ':' + item.id;
    if (!seen.has(k)) { seen.add(k); all.push(item); }
  }
  return all;
}

/** The value an item has for a group dimension: its kind, its system, or (own ships) its mission. */
const groupValue = (item, by) => by === 'kind' ? human(item.kind) : by === 'mission' ? (item.mission ? human(item.mission) : null) : item.system;
const inScope = (item, scope) => !scope || groupValue(item, scope.by) === scope.value;

/** A command's name: the game's own description of the key mapping, else its action made readable. */
const commandLabel = c => (c.description || human((c.action || '').replace(/^UI_/, '').replace(/_/g, ' ')))
  + (c.role ? ` (${human(c.role)})` : '');

function paletteResults() {
  const raw = $('pinput').value.trim().toLowerCase();
  const scope = palette.scope;
  // ">" at the start (or the Commands group) shows only commands, as in VS Code.
  const commandsOnly = raw.startsWith('>') || scope?.by === 'commands';
  const q = raw.startsWith('>') ? raw.slice(1).trim() : raw;
  const commands = [];
  if (commandsOnly || q) {
    for (const c of palette.commands) {
      const label = commandLabel(c);
      const m = q ? fuzzy(label, q) : { score: 0, hits: [] };
      if (m) commands.push({ command: c, label, score: m.score, hits: m.hits });
    }
    commands.sort((a, b) => b.score - a.score || a.label.localeCompare(b.label));
  }
  const items = commandsOnly ? [] : paletteItems().filter(i => inScope(i, scope));

  // Items: best of name, kind and system (only name hits are highlighted).
  const found = [];
  for (const item of items) {
    if (!q) { found.push({ item, score: item.own ? 3 : 0, hits: [] }); continue; }
    const byName = fuzzy(item.name, q), byKind = fuzzy(human(item.kind), q), bySystem = fuzzy(item.system, q);
    const byMission = item.mission ? fuzzy(human(item.mission), q) : null;
    const score = Math.max(byName ? byName.score : -1, byKind ? byKind.score * 0.7 : -1,
      bySystem ? bySystem.score * 0.6 : -1, byMission ? byMission.score * 0.6 : -1);
    if (score < 0) continue;
    found.push({ item, score: score + (item.own ? 3 : 0), hits: byName ? byName.hits : [] });
  }
  found.sort((a, b) => b.score - a.score || (a.item.name || '').localeCompare(b.item.name || ''));

  // Groups (outside a scope only): kinds and systems with how many known items each has.
  const groups = [];
  if (!scope) {
    const count = new Map();
    for (const item of items) {
      for (const by of ['kind', 'system', 'mission']) {
        const value = groupValue(item, by);
        if (!value) continue;
        const k = by + '|' + value;
        count.set(k, (count.get(k) || 0) + 1);
      }
    }
    for (const [k, n] of count) {
      const [by, value] = k.split('|');
      const m = q ? fuzzy(value, q) : { score: n, hits: [] };
      if (m) groups.push({ group: { by, value, count: n }, score: m.score, hits: m.hits });
    }
    groups.sort((a, b) => b.score - a.score || a.group.value.localeCompare(b.group.value));
    if (!commandsOnly && palette.commands.length) {
      const m = q ? fuzzy('commands', q) : { score: 1e6, hits: [] };   // first in the browser view
      if (m) groups.unshift({ group: { by: 'commands', value: 'Commands', count: palette.commands.length }, score: m.score, hits: m.hits });
    }
  }

  // Without a search, groups first (it is a browser); with one, the best items first and a few groups.
  const g = q ? groups.slice(0, 5) : groups.slice(0, 12);
  const f = found.slice(0, 40);
  palette.rows = [];
  let html = '';
  const section = (title, rows) => {
    if (!rows.length) return;
    html += `<div class="psec">${esc(title)}</div>`;
    for (const r of rows) {
      const n = palette.rows.length;
      palette.rows.push(r);
      const on = n === palette.sel ? ' on' : '';
      if (r.command) {
        html += `<div class="pitem${on}" data-n="${n}">
          <span class="pname">${highlight(r.label, r.hits)}</span>
          <span class="pmeta">command${r.command.key ? ' · key ' + esc(r.command.key) : ''}</span>
          <span class="pkey">Enter</span></div>`;
      } else if (r.group) {
        html += `<div class="pitem${on}" data-n="${n}">
          <span class="pname">${highlight(r.group.value, r.hits)}</span>
          <span class="pmeta">${r.group.by} · ${r.group.count}</span>
          <span class="pkey">Tab</span></div>`;
      } else {
        const it = r.item;
        html += `<div class="pitem${on}" data-n="${n}">
          <span class="pname">${highlight(it.name, r.hits)}</span>
          <span class="pmeta">${it.own ? '<span class="own">own</span> · ' : ''}${esc(human(it.kind) || it.type)}${it.mission ? ` · <span class="${it.mission === 'Idle' ? 'flag' : ''}">${esc(human(it.mission))}</span>` : ''}${it.system ? ' · ' + esc(it.system) : ''}</span>
          <span class="pkey">Enter</span></div>`;
      }
    }
  };
  // A search that matches a kind or system as well as any name ("explor") puts the groups first.
  if (commandsOnly) section('Commands', commands.slice(0, 80));
  else {
    const groupsFirst = !q || (g.length && (!f.length || g[0].score >= f[0].score));
    if (groupsFirst) { section('Groups', g); section(!q ? (scope ? 'All' : 'Own') : 'Results', f); }
    else { section('Results', f); section('Groups', g); }
    section('Commands', commands.slice(0, 5));
  }
  palette.sel = Math.min(palette.sel, Math.max(0, palette.rows.length - 1));
  $('plist').innerHTML = html || `<div class="pitem"><span class="pname none">${q ? 'Nothing found' : 'Type to search'}</span></div>`;
  $('pscope').hidden = !scope;
  $('pscope').textContent = scope ? `${scope.value} ›` : '';
  $('pfoot').textContent = scope
    ? '↑↓ choose · Enter go · Backspace (empty search) leave group · Esc close'
    : '↑↓ choose · Enter go · Tab or Enter on a group lists it · > for commands · Esc close';
  const on = $('plist').querySelector('.pitem.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

async function openPalette() {
  palette.open = true;
  palette.remote = [];
  palette.scope = null;
  palette.sel = 0;
  $('palette').hidden = false;
  $('pinput').value = '';
  $('pinput').focus();
  paletteResults();
  getJson('/api/commands').then(r => { palette.commands = r.items || []; if (palette.open) paletteResults(); }).catch(() => { });
  try {
    palette.index = (await getJson('/api/index')).items || [];
    if (!palette.index.length) { await new Promise(r => setTimeout(r, 1200)); palette.index = (await getJson('/api/index')).items || []; }
  } catch (e) { palette.index = []; }
  if (palette.open) paletteResults();
}

function closePalette() {
  palette.open = false;
  $('palette').hidden = true;
}

function enterGroup(group) {
  palette.scope = { by: group.by, value: group.value };
  palette.sel = 0;
  $('pinput').value = '';
  // A system or kind may hold things only the game's search knows about: ask it for the group's name.
  if (group.by === 'system') searchRemote(group.value);
  paletteResults();
}

function paletteChoose(n, viaTab) {
  const r = palette.rows[n];
  if (!r) return;
  if (r.group) { enterGroup(r.group); return; }
  if (r.command) { if (!viaTab) { pressKey(r.command.index); closePalette(); } return; }
  // Tab on an item lists everything of its kind.
  if (viaTab) { if (!palette.scope && r.item.kind) enterGroup({ by: 'kind', value: human(r.item.kind) }); return; }
  goTo(r.item.type, r.item.id);
  closePalette();
}

function searchRemote(q) {
  clearTimeout(palette.timer);
  if (!q) return;
  palette.timer = setTimeout(async () => {
    const seq = ++palette.seq;
    try {
      const res = await getJson('/api/search?q=' + encodeURIComponent(q));
      if (seq !== palette.seq || !palette.open) return;
      const seen = new Set(palette.remote.map(i => i.type + ':' + i.id));
      for (const item of res.items || []) if (!seen.has(item.type + ':' + item.id)) palette.remote.push(item);
      paletteResults();
    } catch (e) { /* game busy or older mod: own things still work */ }
  }, 180);
}

$('pinput').addEventListener('input', () => {
  palette.sel = 0;
  paletteResults();
  searchRemote($('pinput').value.trim());
});

$('pinput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palette.sel = Math.min(palette.sel + 1, palette.rows.length - 1); paletteResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palette.sel = Math.max(palette.sel - 1, 0); paletteResults(); e.preventDefault(); }
  else if (e.key === 'Enter') { paletteChoose(palette.sel, false); e.preventDefault(); }
  else if (e.key === 'Tab') { paletteChoose(palette.sel, true); e.preventDefault(); }
  else if (e.key === 'Backspace' && !$('pinput').value && palette.scope) { palette.scope = null; palette.sel = 0; paletteResults(); e.preventDefault(); }
  else if (e.key === 'Escape') { closePalette(); e.preventDefault(); }
});

$('plist').addEventListener('click', e => {
  const it = e.target.closest('.pitem[data-n]');
  if (it) paletteChoose(+it.dataset.n, false);
});
$('palette').addEventListener('mousedown', e => { if (e.target.id === 'palette') closePalette(); });

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    palette.open ? closePalette() : openPalette();
  }
});

// ---- Start (last, so every declaration above exists before the first render) ----
let startTab = 'overview';
try { startTab = localStorage.getItem('overview.tab') || startTab; } catch (e) { }
setTab(['overview', 'construction', 'ships', 'colonies', 'research', 'messages'].includes(startTab) ? startTab : 'overview');
setInterval(refresh, 2000);
</script>
