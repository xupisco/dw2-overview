<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire Overview</title>
<style>
  /* Look from the Claude Design v3 proposal (design/claude-design): no borders, separation by background
     tones, condensed uppercase headings, one accent; green/amber/red only for status. Barlow is bundled
     in fonts/ (SIL Open Font License), so the page needs nothing from the internet. */
  @font-face { font-family: 'Barlow'; font-weight: 400; font-display: swap; src: url('fonts/barlow-400.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 500; font-display: swap; src: url('fonts/barlow-500.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; font-display: swap; src: url('fonts/barlow-600.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 500; font-display: swap; src: url('fonts/barlow-condensed-500.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('fonts/barlow-condensed-600.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('fonts/barlow-condensed-700.woff2') format('woff2'); }

  :root, [data-theme="Dark"] {
    --bg: #181818; --panel: #202020; --panel-h: #272727; --hover: #2c2c2c; --track: rgba(255,255,255,.09);
    --hdr: rgba(24,24,24,.92); --glow: transparent; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --tx: #e6e6e6; --mut: #9b9b9b; --L: 0.80;
  }
  [data-theme="Deep space"] {
    --bg: #0a1117; --panel: #0f1a22; --panel-h: #13222d; --hover: #16283a; --track: rgba(130,190,225,.12);
    --hdr: rgba(10,17,23,.92); --glow: rgba(70,140,190,.10); --line: rgba(130,190,225,.10); --line-2: rgba(130,190,225,.2);
    --tx: #d5e2eb; --mut: #86a0b2; --L: 0.80;
  }
  [data-theme="Light"] {
    --bg: #f1f1ef; --panel: #ffffff; --panel-h: #f6f6f4; --hover: #ebebe8; --track: rgba(0,0,0,.08);
    --hdr: rgba(241,241,239,.92); --glow: transparent; --line: rgba(0,0,0,.07); --line-2: rgba(0,0,0,.12);
    --tx: #1d1d1c; --mut: #6a6a68; --L: 0.55;
  }
  :root, [data-theme] {
    --acc: oklch(var(--L) 0.11 222); --acc-d: oklch(var(--L) 0.11 222 / .14);
    --ok: oklch(var(--L) 0.11 150); --warn: oklch(var(--L) 0.11 75); --bad: oklch(0.72 0.14 25);
    --pad: 7px; --cond: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    /* older names still used here and there */
    --text: var(--tx); --dim: var(--mut); --accent: var(--acc);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html[data-theme="Light"] { color-scheme: light; }
  body { margin: 0; background: radial-gradient(1200px 500px at 70% -200px, var(--glow), transparent 70%) var(--bg); color: var(--tx);
    font: 13px/1.4 Barlow, system-ui, sans-serif; min-height: 100vh; }
  a { color: var(--acc); }
  ::selection { background: var(--acc-d); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--acc); outline-offset: 1px; }
  button, select, input { font: inherit; color: inherit; }

  /* Header: brand, tabs with counts, tools; then the status line */
  header { position: sticky; top: 0; z-index: 5; background: var(--hdr); backdrop-filter: blur(6px); }
  .hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand i { width: 16px; height: 16px; border: 1px solid var(--acc); transform: rotate(45deg); display: grid; place-items: center; }
  .brand i::after { content: ''; width: 6px; height: 6px; background: var(--acc); }
  .brand b { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
  .tabs { display: flex; overflow-x: auto; flex: 1 1 360px; min-width: 0; order: 3; scrollbar-width: none; }
  .tabs button { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 10px 6px; border: 0; border-bottom: 2px solid transparent; background: transparent;
    color: var(--mut); font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
  .tabs button:hover { color: var(--tx); }
  .tabs button.on { color: var(--tx); border-bottom-color: var(--acc); }
  .tabs button em { font: 500 11px Barlow, sans-serif; letter-spacing: 0; color: var(--mut); font-style: normal; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 6px; align-items: center; margin-left: auto; order: 2; }
  .tool { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 28px; height: 28px; padding: 0 8px;
    border: 0; background: var(--panel); color: var(--mut); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .tool:hover, .tool.on { background: var(--hover); color: var(--tx); }
  .tool kbd { font: 10px Barlow, sans-serif; background: var(--track); padding: 0 4px; }
  .tool .badge { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; padding: 0 3px; background: var(--warn); color: #1a1205;
    font-size: 10px; font-weight: 600; line-height: 15px; text-align: center; }
  .tool .badge[hidden] { display: none; }
  .statusline { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 2px 12px 8px; font-size: 11px; color: var(--mut); font-variant-numeric: tabular-nums; }
  .statusline b { color: var(--tx); font-weight: 500; }
  .statusline .up { color: var(--ok); } .statusline .down { color: var(--bad); } .statusline .paused { color: var(--warn); }
  .dot { display: inline-block; width: 6px; height: 6px; background: var(--bad); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  /* Alert settings, opened from the bell */
  .bellwrap { position: relative; }
  .alertpanel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 6; width: 290px; background: var(--panel); padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); color: var(--tx); font-size: 12px; text-align: left; }
  .alertpanel[hidden] { display: none; }
  .alertpanel h4 { margin: 4px 0 0; font: 600 11px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  .alertpanel select { width: 100%; height: 28px; background: var(--panel-h); border: 0; padding: 0 6px; }
  .mutelist { display: flex; flex-direction: column; gap: 3px; max-height: 40vh; overflow-y: auto; }
  .mutelist label { white-space: nowrap; cursor: pointer; }

  /* Page title row and filters */
  main { width: 100%; max-width: 1600px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .filters h2 { margin: 0 6px 0 0; font: 600 20px var(--cond); letter-spacing: .06em; text-transform: uppercase; }
  .filters input, .filters select, .filters button { height: 28px; background: var(--panel); border: 0; padding: 0 8px; }
  .filters input { min-width: 200px; flex: 0 1 280px; }
  .filters button { cursor: pointer; }
  .filters select:hover, .filters button:hover { background: var(--hover); }
  .count { color: var(--mut); margin-left: auto; font-size: 12px; }
  .hint { color: var(--mut); font-size: 12px; margin-top: -4px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--mut); cursor: pointer; white-space: nowrap; }

  /* Tables: rows separated by tone, no lines */
  .wrap { overflow-x: auto; background: var(--panel); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: var(--pad) 10px; white-space: nowrap; }
  th { background: var(--panel-h); color: var(--mut); font: 600 12px var(--cond); text-transform: uppercase; letter-spacing: .08em; cursor: pointer; user-select: none; }
  th:hover { color: var(--tx); }
  th.sorted { color: var(--acc); }
  th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel-h) 45%, transparent); }
  tbody tr:hover td { background: var(--hover); }
  tbody tr.flash td { background: var(--acc-d); }
  td.num { text-align: right; }
  .none { color: var(--mut); }
  .empty { padding: 40px 16px; color: var(--mut); text-align: center; }
  .flag { color: var(--bad); }
  .go { color: var(--acc); text-decoration: none; }
  .go:hover { color: var(--tx); }

  /* Status tags: colored text on a faint tint */
  .tag { display: inline-block; padding: 0 6px; font: 600 11px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--mut); background: var(--track); }
  .tag.building, .tag.active { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .tag.queued { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .tag.outsideYard, .tag.latest { color: var(--acc); background: var(--acc-d); }
  .tag.facility { color: oklch(var(--L) 0.11 300); background: color-mix(in srgb, oklch(var(--L) 0.11 300) 14%, transparent); }
  .tag.idle, .tag.prio-Low { color: var(--mut); background: transparent; outline: 1px dashed var(--line-2); outline-offset: -1px; }
  .tag.prio-Critical { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .tag.prio-High { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

  /* Construction rows grouped by yard */
  .caret { display: inline-block; width: 18px; color: var(--mut); cursor: pointer; text-align: center; }
  .caret:hover { background: var(--hover); color: var(--tx); }
  .caret.blank { cursor: default; background: none; }
  .more { display: inline-block; margin-left: 6px; padding: 0 6px; background: var(--track); color: var(--mut); font-size: 11px; }
  tr.child td { background: var(--bg) !important; }
  tr.child td:first-child { padding-left: 24px; }
  .sub { color: var(--mut); padding-left: 18px; }

  /* Progress: a thin glowing bar with the number next to it */
  .bar { display: flex; align-items: center; gap: 8px; width: 150px; }
  .bar > i { flex: 1; height: 3px; background: var(--track); position: relative; }
  .bar > i > span { position: absolute; inset: 0 auto 0 0; background: var(--acc); box-shadow: 0 0 6px var(--acc); }
  .bar > em { font-style: normal; font-size: 12px; min-width: 34px; text-align: right; color: var(--acc); }

  /* Overview: a grid of blocks (3 / 2 / 1 columns by width) */
  .ovgrid { --ovcols: 3; display: grid; grid-template-columns: repeat(var(--ovcols), minmax(0, 1fr)); grid-auto-flow: row dense; gap: 12px; }
  @media (max-width: 1200px) { .ovgrid { --ovcols: 2; } }
  @media (max-width: 760px) { .ovgrid { --ovcols: 1; } }
  .ovcell { display: flex; flex-direction: column; min-width: 0; }
  .ovpanel { flex: 1; background: var(--panel); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .ovhead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--panel-h); }
  .ovhead > span { display: flex; align-items: center; gap: 7px; font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
  .ovhead > span i { width: 3px; height: 12px; background: var(--c); }
  .ovnote { font-size: 11px; color: var(--mut); }
  .ovlink { border: 0; background: transparent; color: var(--acc); font-size: 11px; cursor: pointer; white-space: nowrap; padding: 0; }
  .ovlink:hover { color: var(--tx); }
  .ovrow { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: var(--pad) 10px; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .ovrow:hover { background: var(--hover); }
  .ovrow > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ovrow b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovrow small { font-size: 11px; color: var(--mut); }
  .ovrow em { flex: none; font-style: normal; font-size: 11px; color: var(--acc); white-space: nowrap; }
  .ovrow.att > i { flex: none; width: 6px; height: 6px; margin-top: 6px; transform: rotate(45deg); background: var(--acc); }
  .ovrow.att > i.warn { background: var(--warn); } .ovrow.att > i.bad { background: var(--bad); }
  .ovrow.att small { font-size: 12px; }
  .ovrow.prog { flex-direction: column; gap: 5px; }
  .pt { display: flex; justify-content: space-between; gap: 8px; width: 100%; }
  .pt em { font-style: normal; font-size: 12px; color: var(--acc); }
  .pt em.warn, .warn { color: var(--warn); }
  .pb { display: block; width: 100%; height: 3px; background: var(--track); }
  .pb.thick { height: 4px; }
  .pb > i { display: block; height: 100%; background: var(--acc); box-shadow: 0 0 6px var(--acc); }
  .ovres { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ovres .pt b { font: 600 18px var(--cond); }
  .ovres .pt em { font: 600 18px var(--cond); }
  .ovres small { font-size: 11px; color: var(--mut); }
  .ovsmall { padding: 6px 10px 10px; font-size: 12px; color: var(--mut); }
  .ovrow.col { display: grid; grid-template-columns: minmax(0, 1fr) 60px 44px 60px; align-items: center; font-variant-numeric: tabular-nums; }
  .ovrow.col > span:not(:first-child) { text-align: right; }
  .ovrow.col .mut { color: var(--mut); }
  .ovrow.msg { flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
  .ovrow.msg small { flex: 0 0 72px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ovrow.msg span { flex: 1 1 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .ovrow.msg span i { font-style: normal; }
  .ovempty { padding: 14px 10px; color: var(--mut); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 2px; }
  .kpi { display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; border: 0; background: var(--panel); text-align: left; cursor: pointer; min-width: 0; }
  .kpi:hover { background: var(--hover); }
  .kpi span { font: 600 11px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
  .kpi b { font: 600 22px/1.1 var(--cond); font-variant-numeric: tabular-nums; }
  .kpi small { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovfoot { display: flex; justify-content: flex-end; padding-top: 4px; }
  .ovfoot .ovlink { font-size: 12px; color: var(--mut); }
  .ovdrawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 8; width: min(400px, 100%); background: var(--panel); box-shadow: -10px 0 30px rgba(0,0,0,.4);
    padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .ovdrawer[hidden] { display: none; }
  .ovdhead { display: flex; justify-content: space-between; align-items: center; }
  .ovdhead b { font: 600 15px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--acc); }
  .ovdrawer p { margin: 0; color: var(--mut); font-size: 12px; }
  .ovitem { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--panel-h); }
  .ovitem.off > span:nth-child(2) { opacity: .5; }
  .ovitem > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
  .ovitem small { color: var(--mut); font-size: 11px; }
  .sizes, .moves { display: flex; gap: 2px; }
  .sizes button, .moves button { width: 24px; height: 22px; border: 0; background: var(--panel); color: var(--mut); cursor: pointer; font-size: 11px; }
  .sizes button.on { background: var(--acc-d); color: var(--acc); }
  .sizes button:hover, .moves button:hover { color: var(--tx); }
  .moves { flex-direction: column; }
  .moves button { height: 13px; line-height: 1; }
  .switch { position: relative; width: 30px; height: 16px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; background: var(--track); }
  .switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; background: var(--mut); transition: left .15s; }
  .switch input:checked + i { background: var(--acc-d); }
  .switch input:checked + i::after { left: 17px; background: var(--acc); }

  /* Segmented control (group by) */
  .seg { display: inline-flex; background: var(--panel); }
  .filters .seg button { background: transparent; color: var(--mut); padding: 0 12px; }
  .filters .seg button.on { background: var(--acc-d); color: var(--acc); }

  /* Ships: status bar, groups, rows */
  .sstatus { background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sbar { display: flex; gap: 2px; height: 4px; }
  .sbar > i { display: block; height: 100%; }
  .sbar.mini { width: 150px; height: 3px; margin-left: auto; }
  .slegend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .slegend button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 2px 4px; cursor: pointer; color: var(--tx); font-size: 12px; }
  .slegend button i { width: 8px; height: 8px; display: inline-block; }
  .slegend button em { font-style: normal; color: var(--mut); }
  .slegend button.on { background: var(--acc-d); }
  .slegend button.zero { opacity: .45; }
  .slist { display: flex; flex-direction: column; gap: 2px; }
  .sgroup { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--panel-h); cursor: pointer; margin-top: 8px; }
  .sgroup:first-child { margin-top: 0; }
  .sgroup b { font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; }
  .sgroup em { font-style: normal; color: var(--mut); font-size: 12px; }
  .sgroup .sicon { color: var(--acc); }
  .caret2 { color: var(--mut); width: 10px; }
  .srow { display: grid; grid-template-columns: 30px minmax(150px, 1.1fr) minmax(220px, 1.7fr) 130px 120px 130px 40px; gap: 10px; align-items: center;
    padding: 5px 10px; background: var(--panel); cursor: pointer; }
  .srow:hover { background: var(--hover); }
  .srow.flash { background: var(--acc-d); }
  .sicon { display: inline-grid; place-items: center; width: 26px; height: 26px; background: var(--acc-d); color: var(--acc); }
  .sgroup .sicon { background: transparent; width: auto; height: auto; }
  .sname, .ssys { display: flex; flex-direction: column; min-width: 0; }
  .sname b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sname small, .ssys small { color: var(--mut); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .smission { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .smission > i { width: 7px; height: 7px; flex: none; }
  .smission .warn { color: var(--warn); }
  .smission .arrow { color: var(--mut); }
  .chip { font-size: 11px; color: var(--mut); background: var(--track); padding: 0 5px; }
  .sorders { color: var(--mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sfuel { display: flex; align-items: center; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .fbar { width: 46px; height: 3px; background: var(--track); position: relative; }
  .fbar > i { position: absolute; inset: 0 auto 0 0; background: var(--acc); }
  .fbar.low > i { background: var(--bad); }
  .sflags { color: var(--mut); display: flex; gap: 6px; justify-content: flex-end; }
  @media (max-width: 900px) {
    .srow { grid-template-columns: 30px 1fr 1fr; }
    .sorders, .ssys, .sflags { display: none; }
    .sfuel { grid-column: 2 / -1; }
  }

  .group { display: contents; }
  .group[hidden] { display: none; }

  /* In-page message toasts */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 9; max-width: min(380px, calc(100% - 32px)); }
  .toast { background: var(--panel); box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 2px 0 0 var(--acc); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .toast.prio-High { box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 2px 0 0 var(--warn); }
  .toast.prio-Critical { box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 2px 0 0 var(--bad); }
  .toast span { color: var(--mut); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .toast .mute { align-self: flex-end; color: var(--mut); font-size: 11px; text-decoration: none; }
  .toast .mute:hover { color: var(--tx); }

  /* Command palette (Ctrl+K) */
  #palette { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; z-index: 10; }
  #palette[hidden] { display: none; }
  .pbox { width: min(640px, calc(100% - 32px)); background: var(--panel); box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
  .pin { display: flex; align-items: center; background: var(--panel-h); }
  .pbox input { width: 100%; border: 0; background: transparent; color: var(--tx); font-size: 16px; padding: 14px 16px; outline: none; }
  .plist { max-height: 55vh; overflow-y: auto; }
  .pitem { display: flex; gap: 10px; align-items: baseline; padding: 7px 16px; cursor: pointer; }
  .pitem.on { background: var(--acc-d); }
  .pitem .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .pname b { color: var(--acc); font-weight: 600; }
  .pitem .pmeta { color: var(--mut); font-size: 12px; white-space: nowrap; }
  .pitem .own { color: var(--ok); }
  .pfoot { color: var(--mut); font-size: 11px; padding: 6px 16px; background: var(--panel-h); }
  .pscope { margin-left: 16px; padding: 2px 8px; background: var(--acc-d); color: var(--acc); white-space: nowrap; }
  .pscope[hidden] { display: none; }
  .psec { color: var(--mut); font: 600 11px var(--cond); text-transform: uppercase; letter-spacing: .1em; padding: 10px 16px 4px; }
  .pkey { font-size: 10px; color: var(--mut); background: var(--track); padding: 0 5px; visibility: hidden; }
  .pitem.on .pkey { visibility: visible; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><i></i><b>Empire Overview</b></div>
    <nav class="tabs">
      <button type="button" data-tab="overview">Overview <em></em></button>
      <button type="button" data-tab="construction">Construction <em></em></button>
      <button type="button" data-tab="ships">Ships <em></em></button>
      <button type="button" data-tab="colonies">Colonies <em></em></button>
      <button type="button" data-tab="research">Research <em></em></button>
      <button type="button" data-tab="messages">Messages <em></em></button>
    </nav>
    <div class="tools">
      <button type="button" class="tool" id="searchBtn" title="Go to anything, or run a game command (Ctrl K)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
      <span class="bellwrap">
        <button type="button" class="tool" id="bellBtn" title="Alerts for new game messages">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge" id="bellBadge" hidden></span>
        </button>
        <div class="alertpanel" id="alertPanel" hidden>
          <h4>Alerts</h4>
          <select id="notify" title="Which new game messages raise an alert">
            <option value="off">Off</option>
            <option value="2">High and critical</option>
            <option value="1">Normal and up</option>
            <option value="0">Every message</option>
          </select>
          <label class="check" title="When this page is not focused, show alerts as system (Windows) notifications instead of toasts here. Off: always toasts in this page, nothing over the game.">
            <input type="checkbox" id="sysnotify"> System notifications when unfocused
          </label>
          <h4 id="mutedTitle">Alert types</h4>
          <div id="mutedList" class="mutelist"></div>
        </div>
      </span>
      <button type="button" class="tool" id="themeBtn" title="Theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="tool" id="pause" title="Pause updates of this page (the game keeps running)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path id="pauseIcon" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
    </div>
  </div>
  <div class="statusline">
    <span><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
    <span id="empire"></span>
  </div>
</header>

<main>
<div class="filters">
  <h2 id="ptitle">Construction</h2>
  <input id="search" type="search" placeholder="Filter…" autofocus>
  <span id="cfilters" class="group">
  <select id="state">
    <option value="">Everything</option>
    <option value="active">Active (no idle yards)</option>
    <option value="building">Building</option>
    <option value="queued">Queued</option>
    <option value="outsideYard">Outside a yard</option>
    <option value="facility">Facilities</option>
    <option value="idle">Idle yards</option>
  </select>
  <select id="category">
    <option value="">All kinds</option>
    <option value="ship">Ships</option>
    <option value="base">Bases</option>
    <option value="facility">Facilities</option>
    <option value="yard">Yards</option>
  </select>
  <select id="role">
    <option value="">All roles</option>
  </select>
  <select id="work">
    <option value="">All work</option>
  </select>
  <select id="view">
    <option value="yard">One row per yard</option>
    <option value="flat">Every item</option>
  </select>
  </span>
  <span id="rfilters" class="group" hidden>
  <select id="rstate">
    <option value="queue">Queue (active + queued)</option>
    <option value="latest">Researched</option>
    <option value="next">Available, not queued</option>
    <option value="">Everything</option>
  </select>
  </span>
  <span id="gfilters" class="group"></span>
  <span id="sfilters" class="group" hidden>
    <span id="sgroupby" class="seg" title="Group the ships by">
      <button type="button" data-by="role">Role</button><button type="button" data-by="mission">Mission</button><button type="button" data-by="system">System</button><button type="button" data-by="flat">Flat</button>
    </span>
  </span>
  <span id="mfilters" class="group" hidden>
  <select id="mprio">
    <option value="0">All priorities</option>
    <option value="1">Normal and up</option>
    <option value="2">High and up</option>
  </select>
  </span>
  <span class="count" id="count"></span>
</div>

<div class="hint" id="hint"></div>
<div id="tab-overview" hidden>
  <div id="ovGrid" class="ovgrid"></div>
  <div class="ovfoot"><button type="button" id="ovCustomize" class="ovlink">⚙ Customize overview</button></div>
</div>
<div id="ovPanel" class="ovdrawer" hidden>
  <div class="ovdhead"><b>Overview blocks</b><button type="button" id="ovClose" class="ovlink">Close ✕</button></div>
  <p>Turn blocks on or off, pick a width and change the order. S = one column, M = two, L = the whole row. Saved in this browser.</p>
  <div id="ovList"></div>
  <button type="button" id="ovReset" class="ovlink">Reset to default</button>
</div>
<div id="tab-ships" hidden>
  <div id="shipStatus" class="sstatus"></div>
  <div id="shipList" class="slist"></div>
</div>
<div class="wrap" id="tab-other" hidden>
  <table>
    <thead><tr id="ohead"></tr></thead>
    <tbody id="orows"></tbody>
  </table>
  <div id="oempty" class="empty" hidden></div>
</div>
<div class="wrap" id="tab-construction">
  <table>
    <thead><tr>
      <th data-key="state">State</th>
      <th data-key="name">Name</th>
      <th data-key="design">Design</th>
      <th data-key="role">Role</th>
      <th data-key="work">Work</th>
      <th data-key="progress">Progress</th>
      <th data-key="where">Where</th>
      <th data-key="system">System</th>
      <th data-key="queue">Queue</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden></div>
</div>

</main>

<div id="toasts" class="toasts"></div>
<div id="palette" hidden>
  <div class="pbox" role="dialog" aria-label="Go to">
    <div class="pin"><span id="pscope" class="pscope" hidden></span><input id="pinput" type="text" placeholder="Go to… name, kind or system" autocomplete="off"></div>
    <div class="plist" id="plist"></div>
    <div class="pfoot" id="pfoot">↑↓ choose · Enter go · Esc close</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let items = [], shown = [], rowItems = [], paused = false, sortKey = 'state', sortAsc = true, token = null;
const expanded = new Set();
let lastSnapshot = null;
const yardKey = i => `${i.whereType}:${i.whereId}`;
try { $('view').value = localStorage.getItem('overview.view') || 'yard'; } catch (e) { }
const stateOrder = { building: 0, outsideYard: 1, queued: 2, facility: 3, idle: 4 };

// Colonies and research share one generic table. Values are shown raw (2 decimals) until each scale is
// checked against the game's own screens.
let tab = 'construction', other = { rows: [] };
const otherSort = { colonies: { key: 'name', asc: true }, research: { key: 'state', asc: true } };
const researchOrder = { active: 0, queued: 1, latest: 2, next: 3 };
const fmt = {
  num: v => v == null ? null : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : v.toFixed(2)),
  big: v => {
    if (v == null) return null;
    const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (const [n, s] of units) if (Math.abs(v) >= n) return (v / n).toFixed(1) + s;
    return String(v);
  },
  bool: v => v ? 'yes' : '',
  pct: v => v == null ? null : (v * 100).toFixed(0) + '%',
  int: v => v == null ? null : (v > 0 ? '+' : '') + Math.round(v),
};
const columns = {
  colonies: [
    { key: 'name', label: 'Colony' },
    { key: 'system', label: 'System' },
    { key: 'race', label: 'Race' },
    { key: 'population', label: 'Population', f: fmt.big, num: true },
    { key: 'maxPopulation', label: 'Max pop.', f: fmt.big, num: true },
    { key: 'development', label: 'Development', f: fmt.pct, num: true },
    { key: 'approval', label: 'Approval', f: fmt.int, num: true },
    { key: 'happiness', label: 'Happiness', f: fmt.num, num: true },
    { key: 'unrest', label: 'Unrest', f: fmt.num, num: true },
    { key: 'corruption', label: 'Corruption', f: fmt.pct, num: true },
    { key: 'taxRate', label: 'Tax', f: fmt.pct, num: true },
    { key: 'revenue', label: 'Revenue/yr', f: fmt.big, num: true },
    { key: 'quality', label: 'Quality', f: fmt.pct, num: true },
    { key: 'facilities', label: 'Facilities', num: true },
    { key: 'rebelling', label: 'Rebelling', f: v => v ? '<span class="flag">REBELLING</span>' : '', html: true },
    { key: 'autoTax', label: 'Auto tax', f: fmt.bool },
  ],
  research: [
    { key: 'state', label: 'State', f: v => `<span class="tag ${esc(v)}">${esc(v)}</span>`, html: true, order: researchOrder },
    { key: 'order', label: 'Queue', num: true },
    { key: 'name', label: 'Project' },
    // Researched projects keep whatever progress they had (0 for the ones the empire started with), so no bar.
    { key: 'progress', label: 'Progress', f: (v, r) => r.state === 'latest' ? '<span class="none">researched</span>' : progressCell(v), html: true },
    { key: 'size', label: 'Size', f: fmt.num, num: true },
    { key: 'speed', label: 'Speed', f: fmt.num, num: true },
    { key: 'rushing', label: 'Rushing', f: fmt.bool },
    { key: 'atStation', label: 'At station', f: fmt.bool },
  ],
};
/** "ExplorationShip" → "Exploration Ship"; "Base SpaceportSmall" → "Base Spaceport Small". */
const human = s => (s || '').replace(/([a-z])([A-Z])/g, '$1 $2');
const priorityRank = { Low: 0, Normal: 1, High: 2, Critical: 3 };
/** Message text without the game's markup ([LOCATION]…[/LOCATION]) and with collapsed whitespace. */
const plain = s => (s || '').replace(/\[\/?[A-Z]+\]/g, '').replace(/\s+/g, ' ').trim();
columns.messages = [
  { key: 'date', label: 'Date', sortKey: 'starDate', f: (v, r) => r.pending ? `<span class="tag queued" title="Advisor suggestion waiting for your decision in the game">awaiting</span> ${esc(v)}` : esc(v), html: true },
  { key: 'priority', label: 'Priority', f: v => `<span class="tag prio-${esc(v)}">${esc(v)}</span>`, html: true, order: { Critical: 0, High: 1, Normal: 2, Low: 3 } },
  { key: 'type', label: 'Type', f: (v, r) => esc(human(v)) + (r.advisor ? ' <span class="none">(advisor)</span>' : '') + (mutedTypes.has(v) ? ' <span class="none">(muted)</span>' : ''), html: true, filter: 'All types' },
  { key: 'title', label: 'Title' },
  { key: 'text', label: 'Text', f: v => { const t = plain(v); return t.length > 90 ? esc(t.slice(0, 90)) + '…' : esc(t); }, html: true },
  { key: 'relatedName', label: 'About' },
  { key: 'task', label: 'Suggests' },
];
otherSort.messages = { key: 'date', asc: false };

// Ships: every own ship and base with what it is doing. Columns marked `filter` get a select built from the
// values present in the data ("Idle" in Mission shows the ships with nothing to do).
columns.ships = [
  { key: 'name', label: 'Ship' },
  { key: 'kind', label: 'Kind', f: human, filter: 'All kinds' },
  { key: 'design', label: 'Design' },
  { key: 'mission', label: 'Mission', f: v => v === 'Idle' ? '<span class="flag">Idle</span>' : esc(human(v)), html: true, filter: 'All missions' },
  { key: 'target', label: 'Target', f: (v, r) => v ? (r.targetId ? `<a class="go" href="#" data-tt="${esc(r.targetType)}" data-tid="${r.targetId}" title="Go to the target">${esc(v)}</a>` : esc(v)) : '', html: true },
  { key: 'queued', label: 'Next', num: true, f: v => v ? String(v) : '' },
  { key: 'automation', label: 'Orders', f: v => human(v), filter: 'All orders' },
  { key: 'system', label: 'System', filter: 'All systems' },
  { key: 'fleet', label: 'Fleet', filter: 'All fleets' },
  { key: 'damage', label: 'Damage', f: v => v ? fmt.pct(v) : '', num: true },
  { key: 'fuel', label: 'Fuel', f: fmt.pct, num: true },
  { key: 'docked', label: 'Docked', f: fmt.bool },
  { key: 'building', label: 'Building', f: fmt.bool },
];
otherSort.ships = { key: 'name', asc: true };
const filterValues = {};   // tab -> key -> chosen value

/** (Re)builds the filter selects of the current tab from the values in its data, keeping the choices. */
function buildFilters() {
  const cols = (columns[tab] || []).filter(c => c.filter);
  const box = $('gfilters');
  const chosen = filterValues[tab] || (filterValues[tab] = {});
  const wanted = cols.map(c => c.key + ':' + [...new Set(other.rows.map(r => r[c.key]).filter(v => v != null && v !== ''))].sort().join('|')).join('/');
  if (box.dataset.sig === tab + wanted) return;
  box.dataset.sig = tab + wanted;
  box.innerHTML = cols.map(c => {
    const values = [...new Set(other.rows.map(r => r[c.key]).filter(v => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b)));
    if (chosen[c.key] && !values.includes(chosen[c.key])) values.push(chosen[c.key]);
    return `<select data-fkey="${c.key}"><option value="">${esc(c.filter)}</option>${values.map(v =>
      `<option value="${esc(v)}"${chosen[c.key] === String(v) ? ' selected' : ''}>${esc(c.f && !c.html ? c.f(v) : human(String(v)))}</option>`).join('')}</select>`;
  }).join('');
}

const hints = {
  overview: 'What matters at a glance. Click anything to go to it; the tabs have the details.',
  construction: "Click a row to go to its yard or colony in the game; click a ship's name to go to the ship.",
  colonies: 'Click a colony to go to it in the game. Hover a value to see the raw number.',
  messages: 'The game\'s message log, newest first. Click a message to go to what it is about. Notifications need the browser\'s permission once.',
  ships: 'Your ships and bases and what each is doing. Mission "Idle" = nothing to do. Click a ship to go to it, or its target to go there.',
  research: 'Active = within the first N of the queue, N being how many projects your empire researches at once. "Available, not queued" is the game\'s NextProjects list.',
};

function renderOther() {
  if (tab === 'ships') { renderShips(); return; }
  const cols = columns[tab], s = otherSort[tab];
  const q = $('search').value.trim().toLowerCase();
  const col = cols.find(c => c.key === s.key);
  const rs = $('rstate').value;
  const stateOk = r => tab !== 'research' || !rs || (rs === 'queue' ? r.state === 'active' || r.state === 'queued' : r.state === rs);
  const msgOk = r => tab !== 'messages' || (priorityRank[r.priority] ?? 0) >= +$('mprio').value;
  buildFilters();
  const chosen = Object.entries(filterValues[tab] || {}).filter(([, v]) => v);
  const filtersOk = r => chosen.every(([k, v]) => String(r[k] ?? '') === v);
  const sk = col?.sortKey || s.key;
  const rows = other.rows.filter(r => stateOk(r) && msgOk(r) && filtersOk(r) && (!q || cols.some(c => typeof r[c.key] === 'string' && r[c.key].toLowerCase().includes(q))))
    .sort((a, b) => {
      // Advisor suggestions still waiting for a decision always come first.
      if (tab === 'messages' && !!a.pending !== !!b.pending) return a.pending ? -1 : 1;
      let x = a[sk], y = b[sk];
      if (col?.order) { x = col.order[x] ?? 9; y = col.order[y] ?? 9; }
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
      return s.asc ? r : -r;
    });
  $('ohead').innerHTML = cols.map(c => `<th data-okey="${c.key}" class="${c.key === s.key ? 'sorted' + (s.asc ? ' asc' : '') : ''}">${esc(c.label)}</th>`).join('');
  $('orows').innerHTML = rows.map((r, n) => `<tr data-n="${n}">${cols.map(c => {
    const v = r[c.key], out = c.f ? c.f(v, r) : v;
    const text = out == null || out === '' ? (c.f && out === '' ? '' : '<span class="none">–</span>') : (c.html ? out : esc(out));
    return `<td class="${c.num ? 'num' : ''}" title="${v == null ? '' : esc(v)}">${text}</td>`;
  }).join('')}</tr>`).join('');
  otherShown = rows;
  $('count').textContent = `${rows.length} of ${other.rows.length}` + (tab === 'research' && other.concurrent ? ` · ${other.concurrent} at once` : '');
  $('oempty').hidden = rows.length > 0;
  $('oempty').textContent = other.rows.length ? 'Nothing matches the search.' : 'Nothing to show (or no game loaded).';
}
let otherShown = [];

function setTab(name) {
  tab = name;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('tab-construction').hidden = tab !== 'construction';
  $('tab-other').hidden = tab === 'construction' || tab === 'ships' || tab === 'overview';
  $('tab-ships').hidden = tab !== 'ships';
  $('tab-overview').hidden = tab !== 'overview';
  $('search').hidden = tab === 'overview';
  if (tab !== 'overview') $('ovPanel').hidden = true;
  $('sfilters').hidden = tab !== 'ships';
  $('cfilters').hidden = tab !== 'construction';
  $('rfilters').hidden = tab !== 'research';
  $('mfilters').hidden = tab !== 'messages';
  $('gfilters').innerHTML = '';
  $('gfilters').dataset.sig = '';
  $('hint').textContent = hints[tab];
  $('ptitle').textContent = name.charAt(0).toUpperCase() + name.slice(1);
  try { localStorage.setItem('overview.tab', tab); } catch (e) { }
  lastSnapshot = null;
  other = { rows: [] };
  if (tab === 'construction') render(); else if (tab === 'overview') renderOverview(); else renderOther();
  refresh();
}

async function getJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function refresh() {
  if (paused) return;
  try {
    const [info, data] = await Promise.all([getJson('/api/info'), tab === 'overview' ? loadOverview() : getJson('/api/' + tab)]);
    $('dot').classList.add('on');
    token = info.token;
    let rows = [];
    if (!info.loaded) {
      $('status').textContent = 'Live · no game loaded';
      $('empire').innerHTML = '';
    } else {
      $('status').textContent = `Live · ${info.collectedAt}`;
      $('status').title = `updated ${info.collectedAt}, collected in ${info.collectMs} ms`;
      const eco = info.economy || {};
      const money = v => v == null ? '?' : Math.round(v).toLocaleString('en-US');
      const flow = eco.cashflowActual;
      const clock = info.paused ? '<span class="paused">Game paused</span>'
        : info.speed != null ? `Speed <b>×${+info.speed.toFixed(2)}</b>` : '';
      $('empire').innerHTML = [
        `<b>${esc(info.empire)}</b>`,
        `Date <b>${esc(info.starDateText || info.starDate)}</b>`,
        `Cash <b>${money(eco.cash)}</b> <span class="${flow >= 0 ? 'up' : 'down'}">${flow >= 0 ? '+' : ''}${money(flow)}/yr</span>`,
        clock,
      ].filter(Boolean).map(s => `<span>${s}</span>`).join('');
      $('empire').style.display = 'contents';
      $('empire').title = `private cash ${money(eco.privateCash)} · war weariness ${eco.warWeariness ?? '?'}`;
      rows = data.items || [];
      if (info.counts) {
        Object.assign(tabCounts, info.counts);
        $('bellBadge').hidden = !info.counts.pending;
        $('bellBadge').textContent = info.counts.pending || '';
        $('bellBadge').title = `${info.counts.pending} advisor suggestion(s) waiting for a decision`;
      } else {
        tabCounts[tab] = countFor(tab, rows);
        surveyCounts();
      }
      showTabCounts();
    }
    if (info.loaded && $('notify').value !== 'off') {
      checkNotify(tab === 'messages' ? rows : tab === 'overview' ? data.ov.messages : ((await getJson('/api/messages')).items || []), info.starDate);
    }
    if (tab === 'overview') {
      const snap = 'overview' + JSON.stringify(data.ov) + JSON.stringify(info.economy) + info.loaded;
      if (snap === lastSnapshot) return;
      lastSnapshot = snap;
      ov = info.loaded ? data.ov : null;
      ovInfo = info.loaded ? info : null;
      renderOverview();
      return;
    }
    // Redraw only when the data changed: replacing the rows under the mouse can swallow a click.
    const snapshot = tab + JSON.stringify(rows) + (data.concurrent ?? '');
    if (snapshot === lastSnapshot) return;
    lastSnapshot = snapshot;
    if (tab === 'construction') {
      items = rows;
      fillWorkOptions();
      render();
    } else {
      other = { rows, concurrent: data.concurrent };
      renderOther();
    }
  } catch (e) {
    $('dot').classList.remove('on');
    $('status').textContent = 'game not reachable (is it running with the mod?)';
  }
}

// New-message alerts: the first list we see only marks messages as known, so turning this on (or reloading
// the page) does not replay the whole log. After that, each new message at or above the chosen priority
// shows up: as a toast in the page while you are looking at it, or as a system notification when the page
// is hidden or not focused (the game has the focus, another tab is in front). Clicking either goes to what
// the message is about.
// The game's date when alerts started is the baseline: a message dated before it is old news even if this
// page never saw it (the list can come empty while the game is still loading a save).
let knownMessages = null, alertsSince = null;
function checkNotify(messages, starDate) {
  const before = seenTypes.size;
  for (const m of messages) if (m.type) seenTypes.add(m.type);
  if (seenTypes.size !== before) renderMuted();
  if (knownMessages === null) { knownMessages = new Set(messages.map(m => m.key)); alertsSince = starDate; return; }
  if (starDate != null && alertsSince != null && starDate < alertsSince) alertsSince = starDate;   // another save loaded
  const min = +$('notify').value;
  for (const m of [...messages].reverse()) {
    if (knownMessages.has(m.key)) continue;
    knownMessages.add(m.key);
    if (alertsSince != null && m.starDate < alertsSince) continue;
    if ((priorityRank[m.priority] ?? 0) < min) continue;
    if (mutedTypes.has(m.type)) continue;
    const go = () => { if (m.relatedId) goTo(m.relatedType, m.relatedId); };
    const looking = !document.hidden && document.hasFocus();
    // System notifications only when the player turned them on: while playing, a Windows notification pops
    // up over the game; with them off, an unfocused page still shows the toast on its own screen.
    if (!looking && $('sysnotify').checked && 'Notification' in window && Notification.permission === 'granted') {
      const n = new Notification(m.title || 'Distant Worlds 2', { body: plain(m.text), tag: m.key });
      n.onclick = () => { window.focus(); go(); n.close(); };
    } else {
      toast(m, go);
    }
  }
}

let mutedTypes = new Set();
try { mutedTypes = new Set(JSON.parse(localStorage.getItem('overview.mutedTypes') || '[]')); } catch (e) { }

function setMuted(type, muted) {
  if (muted) mutedTypes.add(type); else mutedTypes.delete(type);

function renderMuted() {

function toast(m, onClick) {
  const el = document.createElement('div');
  el.className = 'toast prio-' + (m.priority || 'Normal');
  el.innerHTML = `<b>${esc(m.title || 'Message')}</b><span>${esc(plain(m.text))}</span>
    <a class="mute" href="#" title="No more alerts for this type of message">mute "${esc(human(m.type))}"</a>`;
  el.title = 'Click to go to it · right-click to dismiss';
  el.querySelector('.mute').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setMuted(m.type, true); el.remove(); });
  el.addEventListener('click', () => { onClick(); el.remove(); });
  el.addEventListener('contextmenu', e => { e.preventDefault(); el.remove(); });
  $('toasts').prepend(el);
  setTimeout(() => el.remove(), (priorityRank[m.priority] ?? 1) >= 2 ? 15000 : 8000);

/** Fills a filter with the values present in the data, keeping the current choice when it still exists. */
function fillOptions(selectId, key) {
  const sel = $(selectId), current = sel.value;
  const values = [...new Set(items.map(i => i[key]).filter(Boolean))].sort();
  const have = [...sel.options].slice(1).map(o => o.value);
  if (values.join() === have.join()) return;
  sel.length = 1;
  for (const v of values) sel.add(new Option(v, v));
  sel.value = values.includes(current) ? current : '';
}

function progressCell(p) {

}

// The number next to each tab: what is worth a glance there (busy yards, ships, colonies, projects in the
// queue, messages). Known only for tabs loaded since the page opened.
const tabCounts = {};
function countFor(name, rows) {
  if (name === 'overview') return undefined;
  if (name === 'construction') return rows.filter(r => r.state !== 'idle').length;
  if (name === 'research') return rows.filter(r => r.state === 'active' || r.state === 'queued').length;

// Older mod without counts in /api/info: read every tab once, in the background, so the numbers show up
// without clicking each tab. (Ships are collected only after being asked for, hence the second try.)
let surveyed = false;
async function surveyCounts() {
  if (surveyed) return;
  surveyed = true;
  for (const name of ['construction', 'ships', 'colonies', 'research', 'messages']) {
    if (tabCounts[name] != null) continue;
    try {
      let rows = (await getJson('/api/' + name)).items || [];
      if (!rows.length && name === 'ships') { await new Promise(r => setTimeout(r, 1500)); rows = (await getJson('/api/ships')).items || []; }
      tabCounts[name] = countFor(name, rows);

    } catch (e) { }

}

const esc = s => s == null ? '' : String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function compare(a, b) {
  let x = a[sortKey], y = b[sortKey];
  if (sortKey === 'state') { x = stateOrder[x] ?? 9; y = stateOrder[y] ?? 9; }
  if (x == null && y == null) return 0;
  if (x == null) return 1;
  if (y == null) return -1;
  const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
  return sortAsc ? r : -r;
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const st = $('state').value, cat = $('category').value, work = $('work').value, role = $('role').value;
  shown = items.filter(i =>
    (!st || i.state === st || (st === 'active' && i.state !== 'idle')) &&(!cat || i.category === cat) && (!work || i.work === work) && (!role || i.role === role) &&
    (!q || [i.name, i.design, i.role, i.where, i.system, i.work].some(v => v && v.toLowerCase().includes(q)))
  ).sort(compare);

  // "One row per yard": the yard's first item (in the current sort) stands for it, the rest fold under it.
  // Filters act on items, so a yard shows only what matches, and disappears when nothing does.
  const rows = [];
  if ($('view').value === 'flat') {
    for (const i of shown) rows.push({ item: i, kind: 'flat' });
  } else {
    const groups = new Map();
    for (const i of shown) {
      const k = yardKey(i);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    }
    for (const [k, group] of groups) {
      rows.push({ item: group[0], kind: 'lead', key: k, more: group.length - 1 });
      if (expanded.has(k)) for (const i of group.slice(1)) rows.push({ item: i, kind: 'child' });
    }

  rowItems = rows.map(r => r.item);

  $('rows').innerHTML = rows.map(({ item: i, kind, key, more }, n) => `<tr data-n="${n}" class="${kind}" title="Go to ${esc(i.where)}">
      <td><span class="tag ${esc(i.state)}">${esc(i.state)}</span></td>

function whereCell(i, kind, key, more) {
  const place = `${cell(i.where)}${i.whereKind ? ` <span class="none">(${esc(i.whereKind)})</span>` : ''}`;

  const open = expanded.has(key);
  return `<span class="caret" data-toggle="${esc(key)}" title="${open ? 'Fold' : 'Show'} the other ${more}">${open ? '▾' : '▸'}</span>${place}<span class="more">+${more}</span>`;
}

function nameCell(i) {

// ---- Ships, in the v3 layout ----
// A status bar (working / in transit / in yard / idle / bases) that also filters, ships grouped by category,
// mission or system (or a flat list), and each mission written as a phrase: "Exploring → Kintaris 3".

const MISSION_PHRASE = {
  Move: 'Moving', Attack: 'Attacking', Mine: 'Mining', MineLoad: 'Mining', Build: 'Building base', Transport: 'Hauling cargo',
  Guard: 'Guarding', Refuel: 'Refueling', Repair: 'Going for repair', Escape: 'Escaping', Pickup: 'Picking up',
  PickupLocation: 'Picking up', Retrofit: 'Retrofitting', Retire: 'Retiring', Scrap: 'Scrapping', Colonize: 'Colonizing',
  LoadTroops: 'Loading troops', UnloadTroops: 'Unloading troops', Capture: 'Capturing', Raid: 'Raiding',
  Explore: 'Exploring', ExploreSurvey: 'Exploring', ExploreSystem: 'Exploring system', ExploreLocation: 'Exploring',
  Scout: 'Scouting', Blockade: 'Blockading', Bombard: 'Bombarding', Escort: 'Escorting', Patrol: 'Patrolling',
  ExitConstructionYard: 'Leaving yard', LoadPopulation: 'Loading passengers', UnloadPassengers: 'Unloading passengers',
  TransferFuel: 'Transferring fuel', LoadCargo: 'Loading cargo', UnloadCargo: 'Unloading cargo', EstablishOutpost: 'Establishing outpost',
  Invade: 'Invading', Dock: 'Docking', Undock: 'Undocking', UnderConstruction: 'Under construction', InRepair: 'In repair', Idle: 'Idle',
};
const missionPhrase = m => m ? (MISSION_PHRASE[m] || human(m.replace(/Prepare(Refuel)?$/, ' (preparing)'))) : '';

/** What the ship is doing, in five buckets: the status bar, its filter and the "Mission" grouping. */
const SHIP_BUCKETS = [
  { key: 'working', label: 'Working', color: 'var(--acc)' },
  { key: 'transit', label: 'In transit', color: 'var(--ok)' },
  { key: 'yard', label: 'In yard', color: 'var(--mut)' },
  { key: 'idle', label: 'Idle', color: 'var(--warn)' },
  { key: 'base', label: 'Bases', color: 'var(--line-2)' },
];
function shipBucket(s) {
  const m = s.mission;
  if (!m) return s.isBase ? 'base' : 'idle';
  if (m === 'Idle') return 'idle';
  if (['UnderConstruction', 'InRepair', 'Retrofit', 'ExitConstructionYard'].includes(m)) return 'yard';
  if (['Move', 'Refuel', 'Repair', 'Dock', 'Undock', 'Escape'].includes(m)) return 'transit';
  return 'working';
}

/** Roles folded into a few categories (the "Role" grouping). */
function shipCategory(s) {
  const k = s.kind || '';
  if (s.isBase) return 'Bases';
  if (/Explor/.test(k)) return 'Exploration';
  if (/Construct/.test(k)) return 'Construction';
  if (/Colony/.test(k)) return 'Colonization';
  if (/Freight|Mining|Miner|Passenger|Tanker|Cargo/.test(k)) return 'Logistics';
  if (/Escort|Frigate|Destroyer|Cruiser|Battle|Carrier|Capital|Troop|Military|Patrol|Fighter|Bomber|Gunboat/.test(k)) return 'Military';
  return 'Other';
}
const CATEGORY_ORDER = ['Exploration', 'Construction', 'Colonization', 'Logistics', 'Military', 'Other', 'Bases'];
const CATEGORY_ICON = {
  Exploration: '<circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/>',
  Construction: '<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M12 8v8M8 12h8"/>',
  Colonization: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/>',
  Logistics: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
  Military: '<path d="M12 3 19 6v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
  Bases: '<rect x="7" y="7" width="10" height="10"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  Other: '<circle cx="12" cy="12" r="3"/>',
};
const icon = (cat, size = 14) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${CATEGORY_ICON[cat] || CATEGORY_ICON.Other}</svg>`;

let shipGroupBy = 'role';
try { shipGroupBy = localStorage.getItem('overview.shipGroupBy') || 'role'; } catch (e) { }
const shipBucketFilter = new Set();     // empty = all buckets
const shipCollapsed = new Set();

function miniBar(rows) {
  const n = rows.length || 1;
  return SHIP_BUCKETS.map(b => {
    const c = rows.filter(s => shipBucket(s) === b.key).length;
    return c ? `<i style="flex:${c / n};background:${b.color}"></i>` : '';
  }).join('');
}

function renderShips() {
  const all = other.rows;
  const q = $('search').value.trim().toLowerCase();
  const rows = all.filter(s =>
    (!shipBucketFilter.size || shipBucketFilter.has(shipBucket(s))) &&
    (!q || [s.name, s.kind && human(s.kind), s.design, missionPhrase(s.mission), s.target, s.system, s.fleet]
      .some(v => v && v.toLowerCase().includes(q))));

  // Status bar: the whole fleet, whatever the filters, so it always tells the full story.
  $('shipStatus').innerHTML = `<div class="sbar">${miniBar(all)}</div><div class="slegend">${SHIP_BUCKETS.map(b => {
    const c = all.filter(s => shipBucket(s) === b.key).length;
    const on = shipBucketFilter.has(b.key);
    return `<button type="button" data-bucket="${b.key}" class="${on ? 'on' : ''}${!c ? ' zero' : ''}" title="Show only these (click again to clear)">
      <i style="background:${b.color}"></i>${b.label} <em>${c}</em></button>`;
  }).join('')}</div>`;

  // Groups
  const keyOf = s => shipGroupBy === 'role' ? shipCategory(s) : shipGroupBy === 'mission' ? shipBucket(s) : shipGroupBy === 'system' ? (s.system || '—') : 'all';
  const labelOf = k => shipGroupBy === 'mission' ? (SHIP_BUCKETS.find(b => b.key === k)?.label || k) : k;
  const order = k => shipGroupBy === 'role' ? CATEGORY_ORDER.indexOf(k) : shipGroupBy === 'mission' ? SHIP_BUCKETS.findIndex(b => b.key === k) : 0;
  const groups = new Map();
  for (const s of [...rows].sort((a, b) => (a.name || '').localeCompare(b.name || ''))) {
    const k = keyOf(s);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  const keys = [...groups.keys()].sort((a, b) => order(a) - order(b) || String(a).localeCompare(String(b)));

  shipRowsShown = [];
  let html = '';
  for (const k of keys) {
    const list = groups.get(k);
    const collapsed = shipCollapsed.has(shipGroupBy + ':' + k);
    if (shipGroupBy !== 'flat') {
      html += `<div class="sgroup" data-group="${esc(shipGroupBy + ':' + k)}">
        <span class="caret2">${collapsed ? '▸' : '▾'}</span>
        ${shipGroupBy === 'role' ? `<span class="sicon">${icon(k)}</span>` : ''}
        <b>${esc(labelOf(k))}</b><em>${list.length}</em>
        <span class="sbar mini">${miniBar(list)}</span></div>`;
    }
    if (collapsed) continue;
    for (const s of list) {
      const n = shipRowsShown.length;
      shipRowsShown.push(s);
      const bucket = shipBucket(s);
      const color = SHIP_BUCKETS.find(b => b.key === bucket).color;
      const phrase = missionPhrase(s.mission) || (s.isBase ? 'Base' : '');
      const target = s.target
        ? ` <span class="arrow">→</span> ${s.targetId ? `<a class="go" href="#" data-tt="${esc(s.targetType)}" data-tid="${s.targetId}">${esc(s.target)}</a>` : esc(s.target)}` : '';
      const next = s.queued ? ` <span class="chip">+${s.queued} next</span>` : '';
      const fuel = s.fuel == null ? '<span class="none">–</span>'
        : `<span class="fbar ${s.fuel < 0.25 ? 'low' : ''}"><i style="width:${Math.round(s.fuel * 100)}%"></i></span><span class="${s.fuel < 0.25 ? 'flag' : ''}">${Math.round(s.fuel * 100)}%</span>`;
      const manual = s.automation === 'Manual' || s.manual;
      html += `<div class="srow" data-n="${n}">
        <span class="sicon">${icon(shipCategory(s), 15)}</span>
        <span class="sname"><b>${esc(s.name)}</b><small>${esc(human(s.kind))}${s.design ? ' · ' + esc(s.design) : ''}</small></span>
        <span class="smission"><i style="background:${color}"></i><span class="${bucket === 'idle' ? 'warn' : ''}">${esc(phrase)}</span>${target}${next}</span>
        <span class="sorders" title="${esc(human(s.automation))}">${manual ? '✋ Manual' : '⟳ ' + (s.automation === 'FullyAutomate' ? 'Automatic' : esc(human((s.automation || '').replace(/^Auto/, 'Auto '))))}</span>
        <span class="ssys">${esc(s.system || '')}${s.fleet ? `<small>${esc(s.fleet)}</small>` : ''}</span>
        <span class="sfuel">${fuel}${s.damage ? `<span class="flag" title="Hull damage">✚ ${Math.round(s.damage * 100)}%</span>` : ''}</span>
        <span class="sflags">${s.docked ? '<span title="Docked">⚓</span>' : ''}${s.building ? '<span title="In a yard">⚒</span>' : ''}</span>
      </div>`;
    }
  }
  $('shipList').innerHTML = html || `<div class="empty">${all.length ? 'Nothing matches the filters.' : 'No ships (or no game loaded).'}</div>`;
  $('count').textContent = `${rows.length} of ${all.length}`;
  document.querySelectorAll('#sgroupby button').forEach(b => b.classList.toggle('on', b.dataset.by === shipGroupBy));
}
let shipRowsShown = [];

$('shipStatus').addEventListener('click', e => {
  const b = e.target.closest('[data-bucket]');
  if (!b) return;
  const k = b.dataset.bucket;
  if (shipBucketFilter.has(k)) shipBucketFilter.delete(k); else shipBucketFilter.add(k);
  renderShips();
});
$('sgroupby').addEventListener('click', e => {
  const b = e.target.closest('[data-by]');
  if (!b) return;
  shipGroupBy = b.dataset.by;
  try { localStorage.setItem('overview.shipGroupBy', shipGroupBy); } catch (er) { }
  renderShips();
});
$('shipList').addEventListener('click', e => {
  const g = e.target.closest('.sgroup');
  if (g) {
    const k = g.dataset.group;
    if (shipCollapsed.has(k)) shipCollapsed.delete(k); else shipCollapsed.add(k);
    renderShips();
    return;
  }
  const row = e.target.closest('.srow');
  if (!row) return;
  e.preventDefault();
  const tgt = e.target.closest('[data-tt]');
  if (tgt) goTo(tgt.dataset.tt, +tgt.dataset.tid);

});

// ---- Overview: a configurable dashboard (v3 proposal) ----
// Blocks the player turns on and off, sizes (S = 1 column, M = 2, L = the whole row) and orders, kept in this
// browser. Everything comes from the other tabs' endpoints, read together; "Needs attention" is a set of
// rules over that data, the same kind of rules the background alerts will use.

const OV_BLOCKS = [
  { id: 'summary', name: 'Summary', note: 'Cash, population, yards, research, unrest', size: 'L', on: true },
  { id: 'attention', name: 'Needs attention', note: 'What is waiting for you', size: 'S', on: true },
  { id: 'construction', name: 'Construction', note: 'Busy and queued yards', size: 'S', on: true },
  { id: 'research', name: 'Research', note: 'Active project and queue', size: 'S', on: true },
  { id: 'colonies', name: 'Colonies', note: 'Population, approval, revenue', size: 'S', on: true },
  { id: 'messages', name: 'Latest messages', note: 'Newest five from the log', size: 'M', on: true },
  { id: 'idle', name: 'Idle ships', note: 'Ships without a mission', size: 'S', on: false },
];
let ovLayout = OV_BLOCKS.map(b => ({ id: b.id, size: b.size, on: b.on }));
try {
  const saved = JSON.parse(localStorage.getItem('overview.layout') || 'null');
  if (Array.isArray(saved)) {
    const known = saved.filter(s => OV_BLOCKS.some(b => b.id === s.id));
    ovLayout = [...known, ...ovLayout.filter(d => !known.some(s => s.id === d.id))];   // new blocks join at the end
  }
} catch (e) { }
const saveLayout = () => { try { localStorage.setItem('overview.layout', JSON.stringify(ovLayout)); } catch (e) { } };

let ov = null, ovInfo = null, ovActions = [];

/** Reads what the blocks need, in parallel; ships are collected only once asked for, so they may lag a tick. */
async function loadOverview() {
  const names = ['construction', 'research', 'colonies', 'messages', 'ships'];
  const got = await Promise.all(names.map(n => getJson('/api/' + n).then(r => r).catch(() => ({ items: [] }))));
  const data = {};
  names.forEach((n, i) => { data[n] = got[i].items || []; if (got[i].concurrent != null) data.concurrent = got[i].concurrent; });
  return { items: [], ov: data };
}

const big = v => v == null ? '–' : fmt.big(v);
const money0 = v => v == null ? '?' : Math.round(v).toLocaleString('en-US');

/** Click targets inside the dashboard: an index into ovActions, so each button can do anything. */
function act(fn) { ovActions.push(fn); return `data-act="${ovActions.length - 1}"`; }
const goTab = (name, then) => () => { setTab(name); if (then) setTimeout(then, 0); };

function attentionItems() {
  const items = [];
  const add = (level, title, body, cta, fn) => items.push({ level, title, body, cta, fn });
  for (const m of ov.messages.filter(m => m.pending && m.advisor)) {
    add('warn', 'Advisor suggestion', plain(m.task || m.text), 'Messages', goTab('messages'));
  }
  for (const c of ov.colonies) {
    if (c.rebelling) add('bad', `${c.name} is rebelling`, `Approval ${fmt.int(c.approval)} · unrest ${fmt.num(c.unrest)}`, 'Go to', () => goTo('orb', c.orbId));
    else if (c.approval != null && c.approval < 0) add('warn', `${c.name} is unhappy`, `Approval ${fmt.int(c.approval)}${c.unrest ? ' · unrest ' + fmt.num(c.unrest) : ''}`, 'Go to', () => goTo('orb', c.orbId));
  }
  const idleYards = ov.construction.filter(i => i.state === 'idle');
  if (idleYards.length) add('warn', `${idleYards.length} idle yard${idleYards.length > 1 ? 's' : ''}`, `${[...new Set(idleYards.map(i => i.where))].join(', ')} ${idleYards.length > 1 ? 'have' : 'has'} nothing to build.`, 'Yards',
    goTab('construction', () => { $('state').value = 'idle'; render(); }));
  const active = ov.research.filter(r => r.state === 'active'), queued = ov.research.filter(r => r.state === 'queued');
  if (!active.length) add('bad', 'Nothing being researched', 'The research queue is empty.', 'Research', goTab('research'));
  else if (!queued.length) add('warn', 'Research queue ends soon', `Only ${active.map(r => r.name).join(', ')} ${active.length > 1 ? 'are' : 'is'} queued.`, 'Queue', goTab('research'));
  const idleShips = ov.ships.filter(s => shipBucket(s) === 'idle');
  if (idleShips.length) add('warn', `${idleShips.length} idle ship${idleShips.length > 1 ? 's' : ''}`, idleShips.slice(0, 4).map(s => s.name).join(', ') + (idleShips.length > 4 ? '…' : ''), 'Ships',
    goTab('ships', () => { shipBucketFilter.clear(); shipBucketFilter.add('idle'); renderShips(); }));
  const lowFuel = ov.ships.filter(s => s.fuel != null && s.fuel < 0.2);
  if (lowFuel.length) add('warn', `${lowFuel.length} ship${lowFuel.length > 1 ? 's' : ''} low on fuel`, lowFuel.slice(0, 4).map(s => `${s.name} ${Math.round(s.fuel * 100)}%`).join(', '), 'Ships', goTab('ships'));
  if ((ovInfo.economy?.cashflowActual ?? 0) < 0) add('bad', 'Negative cashflow', `${money0(ovInfo.economy.cashflowActual)} a year`, null, null);
  const order = { bad: 0, warn: 1 };
  return items.sort((a, b) => order[a.level] - order[b.level]);
}

function panel(title, color, link, body) {

}
const linkTo = (label, name) => `<button type="button" class="ovlink" ${act(goTab(name))}>${esc(label)} ›</button>`;

      ${kpi('Population', big(pop), `${ov.colonies.length} colon${ov.colonies.length === 1 ? 'y' : 'ies'}`, 'var(--mut)', goTab('colonies'))}
      ${kpi('Yards', `${busyY} / ${busyY + idleY}`, idleY ? `${idleY} idle` : 'all busy', idleY ? 'var(--warn)' : 'var(--mut)', goTab('construction'))}
      ${kpi('Research', active ? Math.round(active.progress * 100) + '%' : '–', active ? (queued ? `${queued} in queue` : 'queue empty after this') : 'nothing active', active && queued ? 'var(--mut)' : 'var(--warn)', goTab('research'))}
      ${kpi('Unrest', troubled.length, troubled.length ? troubled.map(c => c.name + (c.rebelling ? ' rebelling' : '')).join(', ') : 'all calm', troubled.length ? 'var(--bad)' : 'var(--mut)', goTab('colonies'))}

        <span class="pt"><b>${esc(i.name || i.design || 'Not started')}</b><em class="${i.state === 'queued' ? 'warn' : ''}">${i.progress != null ? Math.round(i.progress * 100) + '%' : i.state}</em></span>
        <span class="pb"><i style="width:${Math.round((i.progress || 0) * 100)}%"></i></span>
        <small>${esc([i.design, i.where].filter(Boolean).join(' · '))}${i.queue ? ' · queue #' + i.queue : ''}</small></button>`).join('')
      || '<div class="ovempty">No yard is building anything.</div>');
  }
  if (id === 'research') {
    const active = ov.research.filter(r => r.state === 'active');
    const queued = ov.research.filter(r => r.state === 'queued');
    return panel('Research', 'var(--acc)', linkTo('Queue', 'research'),
      (active.map(r => `<div class="ovres"><span class="pt"><b>${esc(r.name)}</b><em>${Math.round((r.progress || 0) * 100)}%</em></span>
        <span class="pb thick"><i style="width:${Math.round((r.progress || 0) * 100)}%"></i></span>
        <small>Size ${fmt.num(r.size)}${r.rushing ? ' · crash program' : ''}${r.atStation ? ' · at a research station' : ''}</small></div>`).join('')
        || '<div class="ovempty warn">Nothing is being researched.</div>')
      + (queued.length ? `<div class="ovsmall">Next: ${queued.slice(0, 3).map(r => esc(r.name)).join(', ')}${queued.length > 3 ? '…' : ''}</div>`
        : active.length ? '<div class="ovsmall warn">Queue empty after this project</div>' : ''));
  }
  if (id === 'colonies') {
    const rows = [...ov.colonies].sort((a, b) => (b.population || 0) - (a.population || 0)).slice(0, 6);
    return panel('Colonies', 'var(--acc)', linkTo('All colonies', 'colonies'),
      rows.map(c => `<button type="button" class="ovrow col" ${act(() => goTo('orb', c.orbId))}>
        <span><b>${esc(c.name)}</b><small>${esc(c.system || '')}</small></span>
        <span>${big(c.population)}</span>
        <span style="color:${c.rebelling || c.approval < 0 ? 'var(--bad)' : c.approval < 3 ? 'var(--warn)' : 'var(--ok)'}">${fmt.int(c.approval)}</span>
        <span class="mut">${big(c.revenue)}</span></button>`).join('') || '<div class="ovempty">No colonies.</div>');
  }
  if (id === 'messages') {
    const rows = ov.messages.filter(m => !m.pending).slice(0, 5);
    const color = p => p === 'Critical' ? 'var(--bad)' : p === 'High' ? 'var(--warn)' : p === 'Low' ? 'var(--mut)' : 'var(--acc)';
    return panel('Latest messages', 'var(--acc)', linkTo('Message log', 'messages'),
      rows.map(m => `<button type="button" class="ovrow msg" ${m.relatedId ? act(() => goTo(m.relatedType, m.relatedId)) : ''}>
        <small>${esc(m.date || '')}</small><span><i style="color:${color(m.priority)}">◆</i> ${esc(m.title)}</span><em>${esc(m.relatedName || '')}</em></button>`).join('')
      || '<div class="ovempty">No messages yet.</div>');
  }
  if (id === 'idle') {
    const rows = ov.ships.filter(s => shipBucket(s) === 'idle');
    return panel('Idle ships', 'var(--acc)', linkTo('Ships', 'ships'),
      rows.map(s => `<button type="button" class="ovrow att" ${act(() => goTo('ship', s.id))}><i class="warn"></i><span><b>${esc(s.name)}</b><small>${esc(human(s.kind))}${s.system ? ' · ' + esc(s.system) : ''}</small></span></button>`).join('')

$('ovGrid').addEventListener('click', e => {

});
$('ovList').addEventListener('click', e => {
