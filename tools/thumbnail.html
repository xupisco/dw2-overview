<!doctype html>
<!-- Workshop preview image. Render with tools\build-thumbnail.ps1 (1280x720 CSS at 2x = 2560x1440).
     The screen inside is workshop\overview.jpg (tools\build-screenshots.ps1). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empire Overview preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8e8ee;
    background:
      radial-gradient(720px 420px at 85% 70%, rgba(60, 170, 230, .20), transparent 70%),
      radial-gradient(600px 360px at 5% 100%, rgba(230, 160, 60, .14), transparent 70%),
      radial-gradient(900px 500px at 40% 30%, #12161d 0%, #07080c 70%),
      #05060a;
    position: relative;
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }

  .title { position: absolute; left: 60px; top: 56px; width: 520px; }
  .kicker { font-size: 15px; letter-spacing: 5px; color: #9aa0b4; font-weight: 600; }
  h1 { font-size: 88px; line-height: .95; font-weight: 700; letter-spacing: 4px; margin-top: 12px;
    background: linear-gradient(90deg, #e6f6ff 0%, #8fd8ff 45%, #4fb6ec 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .alpha { display: inline-block; margin-top: 20px; padding: 6px 16px; font-size: 22px; font-weight: 700; letter-spacing: 6px;
    color: #1a1206; background: #f0a84a; border-radius: 3px; box-shadow: 0 0 24px rgba(240, 168, 74, .35); }
  .sub { font-size: 22px; color: #c4c8d6; margin-top: 26px; line-height: 1.45; }
  .sub b { color: #fff; font-weight: 600; }
  .url { margin-top: 26px; font: 600 19px Consolas, monospace; color: #8fd8ff; letter-spacing: .5px; }
  .url span { color: #9aa0b4; font: 400 16px "Segoe UI", sans-serif; letter-spacing: 0; margin-right: 8px; }

  .screen { position: absolute; left: 610px; top: 92px; width: 860px; height: 484px;
    background: url("../workshop/overview.jpg") left top / cover no-repeat;
    border: 1px solid rgba(143, 216, 255, .35); border-radius: 8px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .5), 0 0 60px rgba(79, 182, 236, .15);
    transform: perspective(1400px) rotateY(-14deg) rotateX(3deg); transform-origin: left center; }
  .screen::after { content: ""; position: absolute; inset: 0; border-radius: 8px;
    background: linear-gradient(100deg, rgba(255,255,255,.06), transparent 40%); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="title">
  <div class="kicker">DISTANT WORLDS 2 MOD</div>
  <h1>EMPIRE<br>OVERVIEW</h1>
  <div class="alpha">ALPHA</div>
  <div class="sub">Your empire on a <b>second screen</b>: what needs you, what is being built and why, supply as the game counts it. <b>Click anything</b> to go to it in the game.</div>
  <div class="url"><span>open in any browser</span>localhost:4722</div>
</div>
<div class="screen"></div>

<script>
// Fixed star field (deterministic, so every render looks the same).
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = document.getElementById("stars");
for (let i = 0; i < 140; i++) {
  const s = document.createElement("i");
  s.style.left = (rnd() * 100) + "%"; s.style.top = (rnd() * 100) + "%";
  s.style.opacity = (0.15 + rnd() * 0.6).toFixed(2);
  if (rnd() > 0.85) { s.style.width = s.style.height = "3px"; }
  stars.appendChild(s);
}
</script>
</body>
</html>
