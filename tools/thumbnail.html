<!doctype html>
<!-- Workshop preview image, square (Steam and the launcher show it in a square). Render with tools\build-thumbnail.ps1
     (720x720 CSS at 2x = 1440x1440). The screen inside is workshop\overview.jpg (tools\build-screenshots.ps1). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empire Overview preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 720px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8e8ee;
    background:
      radial-gradient(520px 360px at 90% 80%, rgba(60, 170, 230, .22), transparent 70%),
      radial-gradient(420px 300px at 0% 100%, rgba(230, 160, 60, .14), transparent 70%),
      radial-gradient(600px 420px at 40% 20%, #12161d 0%, #07080c 70%),
      #05060a;
    position: relative;
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }

  .title { position: absolute; left: 48px; top: 44px; right: 40px; }
  .kicker { font-size: 15px; letter-spacing: 5px; color: #9aa0b4; font-weight: 600; }
  h1 { font-size: 104px; line-height: .92; font-weight: 700; letter-spacing: 3px; margin-top: 12px;
    background: linear-gradient(90deg, #e6f6ff 0%, #8fd8ff 50%, #4fb6ec 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .alpha { padding: 5px 14px; font-size: 22px; font-weight: 700; letter-spacing: 6px;
    color: #1a1206; background: #f0a84a; border-radius: 3px; box-shadow: 0 0 24px rgba(240, 168, 74, .35); }
  .sub { font-size: 20px; color: #c4c8d6; line-height: 1.3; }
  .sub b { color: #fff; font-weight: 600; }

  .screen { position: absolute; left: 70px; top: 365px; width: 820px; height: 461px;
    background: url("../workshop/overview.jpg") left top / cover no-repeat;
    border: 1px solid rgba(143, 216, 255, .35); border-radius: 8px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .5), 0 0 60px rgba(79, 182, 236, .15);
    transform: perspective(1400px) rotateY(-12deg) rotateX(6deg); transform-origin: left top; }
  .screen::after { content: ""; position: absolute; inset: 0; border-radius: 8px;
    background: linear-gradient(100deg, rgba(255,255,255,.06), transparent 40%); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="title">
  <div class="kicker">DISTANT WORLDS 2 MOD</div>
  <h1>EMPIRE<br>OVERVIEW</h1>
  <div class="row"><div class="alpha">ALPHA</div><div class="sub">Your empire on a <b>second screen</b></div></div>
</div>
<div class="screen"></div>

<script>
// Fixed star field (deterministic, so every render looks the same).
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = document.getElementById("stars");
for (let i = 0; i < 90; i++) {
  const s = document.createElement("i");
  s.style.left = (rnd() * 100) + "%"; s.style.top = (rnd() * 100) + "%";
  s.style.opacity = (0.15 + rnd() * 0.6).toFixed(2);
  if (rnd() > 0.85) { s.style.width = s.style.height = "3px"; }
  stars.appendChild(s);
}
</script>
</body>
</html>
